[project]
name = "appmetrica-cli"
version = "0.2.0"
description = "Read-only CLI and MCP server for AppMetrica game analytics (unofficial)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "duckdb>=1.5.2",
    "click>=8.1",
    "keyring>=25.0",
]

[project.scripts]
appmetrica = "appmetrica_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appmetrica_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
